profileVersion: "1.0"
profileId: toolplane-safe-loopback-v1
status: proposed-for-future-frozen-evaluation
protocol:
  mcpVersion: "2025-11-25"
  transport: Streamable HTTP
  endpointPath: /mcp/
  sdkAndClientVersions: record-in-release-freeze
network:
  allowedOrigins:
    - http://127.0.0.1:8081
    - http://127.0.0.1:18080
  redirects: disabled
  erpBaseUrlRelocation: disabled-unless-approved-origin-match-is-tested
principals:
  tenantCount: 1
  namedTestPrincipals: required
  clientAuthentication: deployment-bearer-token-only-not-standardized-mcp-authorization
credentials:
  scope: fixed-disposable-local-test-credentials
  storage: gitignored-evaluation-erpnext-dotenv
  rotation: not-evaluated
  tokenLeakageResistance: not-evaluated
  delegation: not-demonstrated
cache:
  mode: disabled-for-identity-or-tenant-sensitive-tools
  requirementBeforeEnablement: revision-principal-tenant-credential-role-policy-and-freshness-isolation-demonstrated
retry:
  safeReadRetry: only-when-explicitly-reviewed
  ambiguousWriteOutcome: no-automatic-retry
responseProcessors:
  mode: disabled
operations:
  permittedEffects:
    - read
    - fixture-resettable-reversible-write
  deniedEffects:
    - sensitive-write
    - irreversible-write
    - financial-write
  dataSensitivity: separately-classified-from-operation-effect
redaction:
  rawCredentials: prohibited
  rawProductionData: prohibited
  rawResponseBodies: prohibited-unless-explicitly-approved-and-redacted
