services:
  mock-erp:
    image: ${MOCK_ERP_IMAGE:-ghcr.io/nmdra/mockerp:0.1.1}
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=debug
      - MOCK_ERP_DB_PATH=/data/mockerp.db
    volumes:
      - mockerp-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health').read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.2.0-v9
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight — remove in production
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  erpbridge-server:
    build:
      context: .
      dockerfile: Dockerfile.server.local
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080
      - ERP_BASE_URL=http://mock-erp:8081
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=/app/data/erpbridge.db
      - ERP_PRIMARY_KEY=${ERP_PRIMARY_KEY:-}
      - RATE_LIMIT_RPS=10
      - RATE_LIMIT_BURST=20
    volumes:
      - erpbridge-data:/app/data
    depends_on:
      mock-erp:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mockerp-data:
  redis-data:
  erpbridge-data:
