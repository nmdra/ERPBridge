apiVersion: erpbridge.io/v1
kind: MCPTool
metadata:
  name: <tool_name>
  version: 1.0.0
  module: <module>
spec:
  description:
    short: "<one concise user-facing outcome>"
    whenToUse:
      - "<user intent this tool fulfills>"
    whenNotToUse:
      - "<similar intent served by another tool>"
    examples:
      - "<example user request>"
  inputSchema:
    type: object
    properties: {}
    required: []
  # Optional. Define the actual final result shape before applying.
  # outputSchema:
  #   type: object
  #   properties: {}
  # Optional MCP routing hints. Keep explicit false values when reviewed.
  # annotations:
  #   title: "<display title>"
  #   readOnlyHint: false
  #   destructiveHint: false
  #   idempotentHint: true
  #   openWorldHint: true
  execution:
    type: http
    method: <METHOD>
    endpoint: <PATH>
    responsePath: <optional.response.path>
  security:
    authType: api-key
    credentialRef: <ERP_CREDENTIAL_REF>
    credentialSource: env # Use file with ERPBRIDGE_CREDENTIALS_DIR for mounted rotation.
    dataClass: internal # public, internal, pii, or restricted
    # pii/restricted require an existing opaque, non-identifying role slug.
    # Never use a person name, email, employee number, or ERP record as a role.
    allowedRoles: []
  cache:
    enabled: false
    flushOn: []
