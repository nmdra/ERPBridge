apiVersion: erpbridge.io/v1
kind: Plugin
metadata:
  name: response-transformer
  version: 1.0.0
  type: api
  isActive: true
spec:
  endpoint: https://plugin-host.example
  timeoutMilliseconds: 5000
  auth:
    type: api-key
    credentialRef: PLUGIN_RESPONSE_TRANSFORMER_KEY
    # credentialSource: file # Reads ERPBRIDGE_CREDENTIALS_DIR/<credentialRef>.
    header: X-API-Key
